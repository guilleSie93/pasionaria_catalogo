<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO básico -->
    <title>Pasionaria | Catálogo de productos naturales</title>
    <meta name="description" content="Catálogo de frutas secas, semillas, cereales, harinas, legumbres, productos sin TACC y más. Armá tu pedido online y enviarlo por WhatsApp.">
    <meta name="keywords" content="frutas secas, semillas, cereales, avenas, harinas, legumbres, sin TACC, premezclas keto, pastas de maní, dietética">
    <meta name="author" content="Pasionaria">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://pasionaria-catalogo.vercel.app/">

    <!-- Color de la barra del navegador en el celular (mismo que el navbar) -->
    <meta name="theme-color" content="#faae51">
    <link rel="icon" href="./public/favicon.jpg" type="image/jpg">

    <!-- Open Graph: WhatsApp, Facebook, Instagram, LinkedIn, Telegram -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pasionaria">
    <meta property="og:locale" content="es_AR">
    <meta property="og:title" content="Pasionaria | Catálogo de productos naturales">
    <meta property="og:description" content="Frutas secas, semillas, cereales, harinas, legumbres y más. Armá tu pedido y enviarlo por WhatsApp.">
    <meta property="og:url" content="https://pasionaria-catalogo.vercel.app/">
    <meta property="og:image" content="https://pasionaria-catalogo.vercel.app/og-image.jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Logo de Pasionaria y productos del catálogo">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pasionaria | Catálogo de productos naturales">
    <meta name="twitter:description" content="Frutas secas, semillas, cereales, harinas, legumbres y más. Armá tu pedido y enviarlo por WhatsApp.">
    <meta name="twitter:image" content="https://pasionaria-catalogo.vercel.app/og-image.jpeg">
    <meta name="twitter:image:alt" content="Logo de Pasionaria y productos del catálogo">

    <!-- Seguridad (lo que se puede definir por meta; el resto va en vercel.json) -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="format-detection" content="telephone=no">

    <!-- Datos estructurados para Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Pasionaria",
      "description": "Catálogo de frutas secas, semillas, cereales, harinas, legumbres y productos sin TACC.",
      "url": "https://pasionaria-catalogo.vercel.app/",
      "image": "https://pasionaria-catalogo.vercel.app/og-image.jpeg"
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
